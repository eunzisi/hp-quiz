<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>해리포터 호그와트 기말고사 (Supabase Realtime)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&family=Sansita+Swashed:wght@700&display=swap');
    
    body {
      font-family: 'Noto Serif KR', serif;
      background: radial-gradient(circle at center, #1a0b2e 0%, #090314 100%);
      color: #f3e5ab;
    }
    .font-magic { font-family: 'Sansita Swashed', cursive; }
    
    /* 기숙사별 컬러 정의 */
    .house-gryffindor { background-color: #740001; border-color: #d3a625; color: #f3e5ab; }
    .house-slytherin { background-color: #1a472a; border-color: #aaaaaa; color: #f3e5ab; }
    .house-ravenclaw { background-color: #0e1a40; border-color: #946b2d; color: #f3e5ab; }
    .house-hufflepuff { background-color: #ecb939; border-color: #372e29; color: #372e29; }

    /* 마법 효과 및 애니메이션 */
    .magic-card {
      background: rgba(20, 10, 35, 0.75);
      backdrop-filter: blur(10px);
      border: 2px solid #d3a625;
      box-shadow: 0 0 20px rgba(211, 166, 37, 0.2);
    }
    
    .gold-glow {
      text-shadow: 0 0 10px rgba(211, 166, 37, 0.7);
    }

    .btn-magic {
      background: linear-gradient(135deg, #4a154b 0%, #2b0938 100%);
      border: 1px solid #d3a625;
      transition: all 0.2s;
    }
    .btn-magic:hover {
      background: linear-gradient(135deg, #631c65 0%, #3d0d4f 100%);
      box-shadow: 0 0 15px rgba(211, 166, 37, 0.5);
      transform: translateY(-2px);
    }

    /* 선택지 버튼 색상 */
    .opt-0 { background: #c0392b; }
    .opt-1 { background: #2980b9; }
    .opt-2 { background: #d35400; }
    .opt-3 { background: #27ae60; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 selection:bg-yellow-500 selection:text-black">

  <!-- Header -->
  <header class="text-center py-4 border-b border-yellow-600/30 flex justify-between items-center px-4 max-w-5xl mx-auto w-full">
    <div class="flex items-center space-x-2">
      <i class="fa-solid fa-hat-wizard text-2xl text-yellow-500"></i>
      <span class="font-magic text-2xl text-yellow-500 tracking-wider">Hogwarts Quiz</span>
    </div>
    <div id="role-badge" class="text-xs px-3 py-1 rounded-full border border-yellow-500/50 bg-yellow-950/40">
      역할 선택 필요
    </div>
  </header>

  <!-- Main Content Area -->
  <main id="app" class="max-w-4xl mx-auto w-full flex-1 flex flex-col justify-center items-center py-6">
    <!-- 화면이 동적으로 로드됩니다 -->
  </main>

  <!-- Footer -->
  <footer class="text-center text-xs text-yellow-600/60 py-4 border-t border-yellow-600/20">
    <p>⚡ Hogwarts School of Witchcraft and Wizardry ⚡</p>
  </footer>

  <script>
    // ==========================================
    // 0. Supabase 설정 (자동 입력 완료)
    // ==========================================
    const SUPABASE_URL = 'https://aovwphtavvdpnqjvgtgf.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_7g0SifR0AHT71mEyMfGVfQ_XkLvhKEi';

    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ==========================================
    // 1. 데이터 (퀴즈 문제)
    // ==========================================
    const QUIZ_DATA = [
      {
        id: 1,
        question: "해리 포터의 생일은 몇 월 몇 일일까요?",
        options: ["6월 30일", "7월 31일", "8월 1일", "9월 1일"],
        answer: 1,
        timeLimit: 15
      },
      {
        id: 2,
        question: "호그와트 4대 기숙사가 아닌 것은 무엇일까요?",
        options: ["그리핀도르", "슬리데린", "후플푸프", "볼드모트"],
        answer: 3,
        timeLimit: 10
      },
      {
        id: 3,
        question: "물건을 소환할 때 쓰는 주문은 무엇일까요?",
        options: ["알로호모라", "아시오", "루모스", "익스펙토 페트로눔"],
        answer: 1,
        timeLimit: 12
      },
      {
        id: 4,
        question: "볼드모트의 본명은 무엇일까요?",
        options: ["톰 마볼로 리들", "겔러트 그린델왈드", "세베루스 스네이프", "시리우스 블랙"],
        answer: 0,
        timeLimit: 15
      }
    ];

    const HOUSES = [
      { id: 'gryffindor', name: '그리핀도르', color: 'house-gryffindor', icon: 'fa-dragon' },
      { id: 'slytherin', name: '슬리데린', color: 'house-slytherin', icon: 'fa-staff-snake' },
      { id: 'ravenclaw', name: '래번클로', color: 'house-ravenclaw', icon: 'fa-crow' },
      { id: 'hufflepuff', name: '후플푸프', color: 'house-hufflepuff', icon: 'fa-dog' }
    ];

    // ==========================================
    // 2. Supabase Realtime 통신 레이어 (Bus)
    // ==========================================
    class SupabaseBus {
      constructor() {
        this.channel = null;
        this.listeners = [];
        this.isSubscribed = false;
        this.pendingMessages = [];
      }

      connect(pin, onSubscribed = null) {
        if (this.channel) {
          sb.removeChannel(this.channel);
        }

        this.isSubscribed = false;
        this.pendingMessages = [];

        this.channel = sb.channel('quiz-' + pin, {
          config: {
            broadcast: { self: true }
          }
        });

        this.channel.on('broadcast', { event: 'quiz-event' }, (payload) => {
          if (payload && payload.payload) {
            const data = payload.payload;
            this.listeners.forEach(cb => cb(data));
          }
        });

        this.channel.subscribe((status) => {
          if (status === 'SUBSCRIBED') {
            this.isSubscribed = true;
            while (this.pendingMessages.length > 0) {
              const msg = this.pendingMessages.shift();
              this.send(msg);
            }
            if (onSubscribed) onSubscribed();
          }
        });
      }

      onMessage(callback) {
        this.listeners.push(callback);
      }

      send(data) {
        if (!this.isSubscribed || !this.channel) {
          this.pendingMessages.push(data);
          return;
        }

        this.channel.send({
          type: 'broadcast',
          event: 'quiz-event',
          payload: data
        });
      }

      disconnect() {
        if (this.channel) {
          sb.removeChannel(this.channel);
          this.channel = null;
        }
        this.isSubscribed = false;
        this.listeners = [];
        this.pendingMessages = [];
      }
    }

    const bus = new SupabaseBus();

    // ==========================================
    // 3. 앱 상태 관리 및 뷰 전환
    // ==========================================
    const state = {
      role: null,
      pin: null,
      host: null,
      player: null
    };

    function renderScreen(html) {
      document.getElementById('app').innerHTML = html;
    }

    function setBadge(text) {
      document.getElementById('role-badge').innerText = text;
    }

    function showRoleSelection() {
      state.role = null;
      bus.disconnect();

      setBadge("역할 선택 필요");
      renderScreen(`
        <div class="magic-card p-8 rounded-2xl text-center max-w-md w-full border-2 border-yellow-500/50">
          <h1 class="text-3xl font-bold mb-2 font-magic text-yellow-400 gold-glow">호그와트 마법 퀴즈</h1>
          <p class="text-sm text-yellow-200/70 mb-8">접속할 역할을 선택하세요</p>
          
          <div class="space-y-4">
            <button onclick="startHost()" class="btn-magic w-full py-4 rounded-xl font-bold text-lg text-yellow-300 flex items-center justify-center space-x-3">
              <i class="fa-solid fa-crown text-xl text-yellow-400"></i>
              <span>퀴즈 진행자 (PC / 화면)</span>
            </button>
            
            <button onclick="startPlayerScreen()" class="btn-magic w-full py-4 rounded-xl font-bold text-lg text-yellow-300 flex items-center justify-center space-x-3">
              <i class="fa-solid fa-wand-magic-sparkles text-xl text-yellow-400"></i>
              <span>퀴즈 참가자 (스마트폰)</span>
            </button>
          </div>
        </div>
      `);
    }

    // ==========================================
    // 4. HOST (운영자) 로직
    // ==========================================
    class HostController {
      constructor() {
        this.pin = Math.floor(100000 + Math.random() * 900000).toString();
        this.players = new Map();
        this.currentQIndex = -1;
        this.state = 'LOBBY';
        this.timer = null;
        this.timeLeft = 0;
        this.questionStartTime = 0;

        bus.connect(this.pin, () => {
          console.log(`[Host] Supabase Realtime connected on PIN: ${this.pin}`);
        });

        bus.onMessage((msg) => this.handleMessage(msg));
      }

      handleMessage(msg) {
        if (msg.type === 'JOIN') {
          const { playerId, nickname, house } = msg;
          
          let player = this.players.get(playerId);
          if (!player) {
            player = { id: playerId, nickname, house, score: 0, lastAnswer: null };
            this.players.set(playerId, player);
          } else {
            player.nickname = nickname;
            player.house = house;
          }

          bus.send({
            type: 'JOIN_RESULT',
            targetId: playerId,
            success: true,
            gameState: this.state
          });

          this.renderLobby();
        } else if (msg.type === 'ANSWER') {
          if (this.state !== 'QUESTION') return;
          const { playerId, answerIndex } = msg;
          const player = this.players.get(playerId);
          
          if (player && player.lastAnswer === null) {
            const now = Date.now();
            const timeTaken = (now - this.questionStartTime) / 1000;
            const q = QUIZ_DATA[this.currentQIndex];

            player.lastAnswer = answerIndex;

            if (answerIndex === q.answer) {
              const remainingRatio = Math.max(0, (q.timeLimit - timeTaken) / q.timeLimit);
              const scoreGained = Math.round(500 + (500 * remainingRatio));
              player.score += scoreGained;
            }

            this.updateSubmittedCount();
          }
        }
      }

      renderLobby() {
        setBadge(`진행자 | PIN: ${this.pin}`);
        const playerList = Array.from(this.players.values());

        renderScreen(`
          <div class="w-full max-w-3xl flex flex-col items-center">
            <div class="magic-card p-6 rounded-2xl w-full text-center mb-6">
              <span class="text-sm text-yellow-300/70">참가 PIN 번호</span>
              <div class="text-5xl font-black font-magic text-yellow-400 tracking-widest my-2 gold-glow">${this.pin}</div>
              <p class="text-xs text-yellow-200/60">참가자는 스마트폰에서 위 PIN 번호를 입력하세요</p>
            </div>

            <div class="w-full mb-6">
              <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-yellow-300">접속한 학생들 (${playerList.length}명)</h2>
                <button onclick="hostAddBot()" class="text-xs px-3 py-1 bg-yellow-900/50 border border-yellow-600 rounded text-yellow-300 hover:bg-yellow-800/50">
                  + 가상 봇 추가
                </button>
              </div>

              <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
                ${playerList.map(p => {
                  const h = HOUSES.find(x => x.id === p.house) || HOUSES[0];
                  return `
                    <div class="p-3 rounded-xl border ${h.color} flex items-center space-x-3 shadow-md">
                      <i class="fa-solid ${h.icon} text-lg"></i>
                      <div class="truncate">
                        <div class="font-bold text-sm truncate">${p.nickname}</div>
                        <div class="text-xs opacity-75">${h.name}</div>
                      </div>
                    </div>
                  `;
                }).join('')}
                ${playerList.length === 0 ? `<div class="col-span-full text-center py-8 text-yellow-500/50">학생들이 입장을 기다리고 있습니다...</div>` : ''}
              </div>
            </div>

            <button onclick="host.nextQuestion()" ${playerList.length === 0 ? 'disabled class="opacity-50 btn-magic px-8 py-4 rounded-xl font-bold text-lg text-yellow-300 cursor-not-allowed"' : 'class="btn-magic px-8 py-4 rounded-xl font-bold text-lg text-yellow-300"'}>
              퀴즈 시작하기 ⚡
            </button>
          </div>
        `);
      }

      nextQuestion() {
        this.currentQIndex++;
        if (this.currentQIndex >= QUIZ_DATA.length) {
          this.endGame();
          return;
        }

        this.players.forEach(p => p.lastAnswer = null);

        const q = QUIZ_DATA[this.currentQIndex];
        this.state = 'QUESTION';
        this.timeLeft = q.timeLimit;
        this.questionStartTime = Date.now();

        bus.send({
          type: 'QUESTION',
          questionIndex: this.currentQIndex,
          totalQuestions: QUIZ_DATA.length,
          question: q.question,
          options: q.options,
          timeLimit: q.timeLimit
        });

        this.renderQuestionView();
        this.startTimer();
      }

      startTimer() {
        if (this.timer) clearInterval(this.timer);
        this.timer = setInterval(() => {
          this.timeLeft--;
          const timerEl = document.getElementById('host-timer');
          if (timerEl) timerEl.innerText = this.timeLeft;

          if (this.timeLeft <= 0) {
            clearInterval(this.timer);
            this.revealAnswer();
          }
        }, 1000);
      }

      updateSubmittedCount() {
        const submitted = Array.from(this.players.values()).filter(p => p.lastAnswer !== null).length;
        const total = this.players.size;
        const el = document.getElementById('submitted-count');
        if (el) el.innerText = `${submitted} / ${total}`;

        if (submitted >= total && total > 0) {
          if (this.timer) clearInterval(this.timer);
          this.revealAnswer();
        }
      }

      renderQuestionView() {
        const q = QUIZ_DATA[this.currentQIndex];
        renderScreen(`
          <div class="w-full max-w-3xl flex flex-col items-center">
            <div class="flex justify-between items-center w-full mb-4 px-2">
              <span class="text-yellow-400 font-bold">Q ${this.currentQIndex + 1} / ${QUIZ_DATA.length}</span>
              <div class="text-2xl font-black text-yellow-400 bg-yellow-950/60 border border-yellow-500/40 px-4 py-1 rounded-full">
                ⏳ <span id="host-timer">${this.timeLeft}</span>초
              </div>
            </div>

            <div class="magic-card p-8 rounded-2xl w-full text-center mb-6">
              <h2 class="text-2xl md:text-3xl font-bold text-yellow-200">${q.question}</h2>
            </div>

            <div class="grid grid-cols-2 gap-4 w-full mb-6">
              ${q.options.map((opt, i) => `
                <div class="opt-${i} p-4 rounded-xl text-white font-bold text-center text-lg shadow-lg flex items-center justify-center min-h-[70px]">
                  ${opt}
                </div>
              `).join('')}
            </div>

            <div class="text-sm text-yellow-300/80 mb-4">
              제출 완료: <span id="submitted-count" class="font-bold text-yellow-400">0 / ${this.players.size}</span>
            </div>

            <button onclick="host.revealAnswer()" class="text-xs text-yellow-400/60 underline hover:text-yellow-300">
              바로 결과 공개
            </button>
          </div>
        `);
      }

      revealAnswer() {
        if (this.timer) clearInterval(this.timer);
        this.state = 'REVEAL';

        const q = QUIZ_DATA[this.currentQIndex];

        bus.send({
          type: 'REVEAL',
          correctAnswer: q.answer,
          scores: Array.from(this.players.values()).map(p => ({
            id: p.id,
            score: p.score,
            isCorrect: p.lastAnswer === q.answer
          }))
        });

        this.renderRevealView();
      }

      renderRevealView() {
        const q = QUIZ_DATA[this.currentQIndex];
        const sortedPlayers = Array.from(this.players.values())
          .sort((a, b) => b.score - a.score);

        renderScreen(`
          <div class="w-full max-w-3xl flex flex-col items-center">
            <h2 class="text-xl font-bold text-yellow-400 mb-2">정답 공개</h2>
            <div class="opt-${q.answer} p-4 rounded-xl text-white font-bold text-center text-xl shadow-lg w-full mb-6">
              정답: ${q.options[q.answer]}
            </div>

            <div class="magic-card p-6 rounded-2xl w-full mb-6">
              <h3 class="text-lg font-bold text-yellow-300 mb-4 border-b border-yellow-600/30 pb-2">중간 순위</h3>
              <div class="space-y-2 max-h-60 overflow-y-auto pr-2">
                ${sortedPlayers.map((p, idx) => {
                  const h = HOUSES.find(x => x.id === p.house) || HOUSES[0];
                  return `
                    <div class="flex items-center justify-between p-2 rounded-lg bg-yellow-950/30 border border-yellow-600/20">
                      <div class="flex items-center space-x-3">
                        <span class="font-bold text-yellow-500 w-6">${idx + 1}</span>
                        <span class="font-bold text-yellow-200">${p.nickname}</span>
                        <span class="text-xs px-2 py-0.5 rounded ${h.color}">${h.name}</span>
                      </div>
                      <span class="font-black text-yellow-400">${p.score} pts</span>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <button onclick="host.nextQuestion()" class="btn-magic px-8 py-4 rounded-xl font-bold text-lg text-yellow-300">
              ${this.currentQIndex + 1 < QUIZ_DATA.length ? '다음 문제 ⚡' : '최종 결과 보기 🏆'}
            </button>
          </div>
        `);
      }

      endGame() {
        this.state = 'END';
        bus.send({ type: 'GAME_OVER' });

        const sorted = Array.from(this.players.values()).sort((a, b) => b.score - a.score);
        const winner = sorted[0];

        renderScreen(`
          <div class="w-full max-w-xl text-center">
            <h1 class="text-4xl font-black font-magic text-yellow-400 gold-glow mb-2">최종 결과</h1>
            <p class="text-yellow-200/70 mb-8">호그와트 기말고사 우승자</p>

            ${winner ? `
              <div class="magic-card p-8 rounded-2xl mb-8 border-2 border-yellow-400 gold-glow">
                <i class="fa-solid fa-trophy text-5xl text-yellow-400 mb-4"></i>
                <div class="text-3xl font-black text-yellow-300 mb-1">${winner.nickname}</div>
                <div class="text-sm text-yellow-200/80 mb-3">${(HOUSES.find(h=>h.id===winner.house)||{}).name || ''}</div>
                <div class="text-2xl font-bold text-yellow-400">${winner.score} pts</div>
              </div>
            ` : ''}

            <button onclick="showRoleSelection()" class="btn-magic px-8 py-3 rounded-xl font-bold text-yellow-300">
              메인 화면으로 돌아가기
            </button>
          </div>
        `);
      }
    }

    let host = null;

    function startHost() {
      state.role = 'host';
      state.host = new HostController();
      host = state.host;
      state.host.renderLobby();
    }

    function hostAddBot() {
      if (!state.host) return;
      const botNames = ['해리', '론', '헤르미온느', '말포이', '네빌', '루나'];
      const randomName = botNames[Math.floor(Math.random() * botNames.length)] + Math.floor(Math.random()*100);
      const randomHouse = HOUSES[Math.floor(Math.random() * HOUSES.length)].id;
      const botId = 'bot-' + Math.random().toString(36).substr(2, 9);

      state.host.handleMessage({
        type: 'JOIN',
        playerId: botId,
        nickname: randomName,
        house: randomHouse
      });
    }

    // ==========================================
    // 5. PLAYER (참가자) 로직
    // ==========================================
    class PlayerController {
      constructor() {
        let savedId = localStorage.getItem('hp_quiz_player_id');
        if (!savedId) {
          savedId = 'player-' + Math.random().toString(36).substr(2, 9);
          localStorage.setItem('hp_quiz_player_id', savedId);
        }
        this.id = savedId;

        this.nickname = '';
        this.house = HOUSES[0].id;
        this.pin = '';
        this.myScore = 0;
        this.selectedAnswer = null;
        this.hasAnswered = false;
      }

      joinGame(pin, nickname, house) {
        this.pin = pin;
        this.nickname = nickname;
        this.house = house;

        bus.connect(this.pin, () => {
          console.log(`[Player] Subscribed to PIN: ${this.pin}`);
          bus.send({
            type: 'JOIN',
            playerId: this.id,
            nickname: this.nickname,
            house: this.house
          });
        });

        bus.onMessage((msg) => this.handleMessage(msg));

        renderScreen(`
          <div class="magic-card p-8 rounded-2xl text-center max-w-md w-full">
            <i class="fa-solid fa-spinner fa-spin text-3xl text-yellow-400 mb-4"></i>
            <h2 class="text-xl font-bold text-yellow-300 mb-2">호그와트 연결 중...</h2>
            <p class="text-xs text-yellow-200/60">진행자가 게임을 시작할 때까지 기다려주세요.</p>
          </div>
        `);
      }

      handleMessage(msg) {
        if (msg.type === 'JOIN_RESULT') {
          if (msg.targetId === this.id && msg.success) {
            this.renderWaitingView();
          }
        } else if (msg.type === 'QUESTION') {
          this.selectedAnswer = null;
          this.hasAnswered = false;
          this.renderQuestionView(msg);
        } else if (msg.type === 'REVEAL') {
          const myResult = msg.scores.find(s => s.id === this.id);
          if (myResult) {
            this.myScore = myResult.score;
          }
          this.renderResultView(msg.correctAnswer, myResult ? myResult.isCorrect : false);
        } else if (msg.type === 'GAME_OVER') {
          this.renderGameOverView();
        } else if (msg.type === 'RESET') {
          showRoleSelection();
        }
      }

      renderWaitingView() {
        const h = HOUSES.find(x => x.id === this.house) || HOUSES[0];
        setBadge(`참가자 | ${this.nickname}`);

        renderScreen(`
          <div class="magic-card p-8 rounded-2xl text-center max-w-md w-full">
            <div class="inline-block p-4 rounded-full ${h.color} mb-4">
              <i class="fa-solid ${h.icon} text-3xl"></i>
            </div>
            <h2 class="text-2xl font-bold text-yellow-300 mb-1">${this.nickname}</h2>
            <p class="text-sm text-yellow-200/70 mb-6">${h.name} 기숙사</p>

            <div class="p-4 rounded-xl bg-yellow-950/40 border border-yellow-600/30 text-yellow-400 animate-pulse text-sm">
              진행자가 문제를 내기를 기다리고 있습니다...
            </div>
          </div>
        `);
      }

      sendAnswer(index) {
        if (this.hasAnswered) return;
        this.selectedAnswer = index;
        this.hasAnswered = true;

        bus.send({
          type: 'ANSWER',
          playerId: this.id,
          answerIndex: index
        });

        this.renderAnswerSubmittedView();
      }

      renderQuestionView(qMsg) {
        renderScreen(`
          <div class="w-full max-w-md flex flex-col items-center">
            <div class="flex justify-between items-center w-full mb-4 px-2">
              <span class="text-xs text-yellow-400">Q ${qMsg.questionIndex + 1} / ${qMsg.totalQuestions}</span>
              <span class="text-xs text-yellow-300 font-bold">내 점수: ${this.myScore}</span>
            </div>

            <div class="grid grid-cols-2 gap-4 w-full h-64">
              ${qMsg.options.map((_, idx) => `
                <button onclick="player.sendAnswer(${idx})" class="opt-${idx} rounded-2xl flex items-center justify-center text-white text-3xl font-bold shadow-lg active:scale-95 transition-transform">
                  ${['▲', '◆', '●', '■'][idx]}
                </button>
              `).join('')}
            </div>
          </div>
        `);
      }

      renderAnswerSubmittedView() {
        renderScreen(`
          <div class="magic-card p-8 rounded-2xl text-center max-w-md w-full">
            <i class="fa-solid fa-paper-plane text-4xl text-yellow-400 mb-4 animate-bounce"></i>
            <h2 class="text-2xl font-bold text-yellow-300 mb-2">답안 제출 완료!</h2>
            <p class="text-xs text-yellow-200/60">다른 학생들의 제출을 기다리는 중입니다.</p>
          </div>
        `);
      }

      renderResultView(correctAnswer, isCorrect) {
        renderScreen(`
          <div class="magic-card p-8 rounded-2xl text-center max-w-md w-full">
            <div class="text-5xl mb-4">
              ${isCorrect ? '⭕' : '❌'}
            </div>
            <h2 class="text-2xl font-bold ${isCorrect ? 'text-green-400' : 'text-red-400'} mb-2">
              ${isCorrect ? '정답입니다!' : '틀렸습니다...'}
            </h2>
            <div class="text-lg text-yellow-300 font-bold mb-6">
              현재 점수: ${this.myScore} pts
            </div>
            <p class="text-xs text-yellow-200/60">다음 문제를 기다려주세요</p>
          </div>
        `);
      }

      renderGameOverView() {
        renderScreen(`
          <div class="magic-card p-8 rounded-2xl text-center max-w-md w-full">
            <i class="fa-solid fa-award text-5xl text-yellow-400 mb-4 gold-glow"></i>
            <h2 class="text-3xl font-bold font-magic text-yellow-400 mb-2">퀴즈 종료!</h2>
            <p class="text-sm text-yellow-200/70 mb-4">최종 점수</p>
            <div class="text-4xl font-black text-yellow-300 gold-glow mb-6">${this.myScore} pts</div>

            <button onclick="showRoleSelection()" class="btn-magic px-6 py-3 rounded-xl font-bold text-yellow-300 text-sm">
              메인 화면으로
            </button>
          </div>
        `);
      }
    }

    let player = null;

    function startPlayerScreen() {
      state.role = 'player';
      player = new PlayerController();

      setBadge("참가자 설정");
      renderScreen(`
        <div class="magic-card p-8 rounded-2xl max-w-md w-full">
          <h2 class="text-2xl font-bold text-center text-yellow-400 font-magic mb-6">학생 등록</h2>

          <div class="space-y-4">
            <div>
              <label class="block text-xs text-yellow-300/80 mb-1">PIN 번호 6자리</label>
              <input id="join-pin" type="text" maxlength="6" placeholder="예: 123456" class="w-full bg-yellow-950/40 border border-yellow-600/50 rounded-xl px-4 py-3 text-yellow-200 placeholder-yellow-700/50 focus:outline-none focus:border-yellow-400 text-center text-xl font-bold tracking-widest">
            </div>

            <div>
              <label class="block text-xs text-yellow-300/80 mb-1">이름 / 닉네임</label>
              <input id="join-name" type="text" placeholder="이름을 입력하세요" class="w-full bg-yellow-950/40 border border-yellow-600/50 rounded-xl px-4 py-3 text-yellow-200 placeholder-yellow-700/50 focus:outline-none focus:border-yellow-400">
            </div>

            <div>
              <label class="block text-xs text-yellow-300/80 mb-1">기숙사 선택</label>
              <div class="grid grid-cols-2 gap-2">
                ${HOUSES.map((h, idx) => `
                  <label class="cursor-pointer">
                    <input type="radio" name="house" value="${h.id}" ${idx===0?'checked':''} class="peer hidden">
                    <div class="p-3 rounded-xl border border-yellow-600/30 peer-checked:border-yellow-400 peer-checked:bg-yellow-900/40 flex items-center space-x-2 text-sm text-yellow-200">
                      <i class="fa-solid ${h.icon}"></i>
                      <span>${h.name}</span>
                    </div>
                  </label>
                `).join('')}
              </div>
            </div>

            <button onclick="submitJoin()" class="btn-magic w-full py-4 rounded-xl font-bold text-yellow-300 text-lg mt-4">
              입장하기 ⚡
            </button>
          </div>
        </div>
      `);
    }

    function submitJoin() {
      const pin = document.getElementById('join-pin').value.trim();
      const name = document.getElementById('join-name').value.trim();
      const house = document.querySelector('input[name="house"]:checked')?.value || 'gryffindor';

      if (!pin || pin.length < 6) {
        alert("6자리 PIN 번호를 입력해주세요.");
        return;
      }
      if (!name) {
        alert("이름을 입력해주세요.");
        return;
      }

      player.joinGame(pin, name, house);
    }

    showRoleSelection();
  </script>
</body>
</html>

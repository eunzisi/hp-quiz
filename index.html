// ==========================================
// 2. Supabase Realtime 통신 레이어 (Bus)
// ==========================================
class SupabaseBus {
  constructor() {
    this.channel = null;
    this.listeners = [];
    this.isSubscribed = false;
    this.pendingMessages = [];
  }

  connect(pin, onSubscribed = null) {
    if (this.channel) sb.removeChannel(this.channel);
    this.isSubscribed = false;
    this.pendingMessages = [];

    this.channel = sb.channel('quiz-' + pin, {
      config: { broadcast: { self: true } }
    });

    this.channel.on('broadcast', { event: 'quiz-event' }, (payload) => {
      if (payload && payload.payload) {
        this.listeners.forEach(cb => cb(payload.payload));
      }
    });

    this.channel.subscribe((status) => {
      if (status === 'SUBSCRIBED') {
        this.isSubscribed = true;
        while (this.pendingMessages.length > 0) {
          this.send(this.pendingMessages.shift());
        }
        if (onSubscribed) onSubscribed();
      }
    });
  }

  onMessage(callback) {
    this.listeners.push(callback);
  }

  send(data) {
    if (!this.isSubscribed || !this.channel) {
      this.pendingMessages.push(data);
      return;
    }
    this.channel.send({
      type: 'broadcast',
      event: 'quiz-event',
      payload: data
    });
  }

  disconnect() {
    if (this.channel) {
      sb.removeChannel(this.channel);
      this.channel = null;
      this.isSubscribed = false;
      this.listeners = [];
      this.pendingMessages = [];
    }
  }
}

            <div class="grid grid-cols-2 gap-4 pt-2">
              <div>
                <label class="block text-xs text-yellow-300/80 mb-1"><i class="fa-solid fa-star text-yellow-400 mr-1"></i>배점 (최대 점수)</label>
                <input type="number" min="100" step="100" value="${q.points || 1000}"
                  oninput="updateAdminField(${qIdx}, 'points', Number(this.value))"
                  class="w-full bg-yellow-950/50 border border-yellow-600/50 rounded-xl px-3 py-2 text-sm text-yellow-100 focus:outline-none focus:border-yellow-400">
              </div>
              <div>
                <label class="block text-xs text-yellow-300/80 mb-1"><i class="fa-solid fa-clock text-yellow-400 mr-1"></i>제한 시간 (초)</label>
                <input type="number" min="5" max="120" value="${q.timeLimit || 15}"
                  oninput="updateAdminField(${qIdx}, 'timeLimit', Number(this.value))"
                  class="w-full bg-yellow-950/50 border border-yellow-600/50 rounded-xl px-3 py-2 text-sm text-yellow-100 focus:outline-none focus:border-yellow-400">
              </div>
            </div>
          </div>
        `).join('')}
      </div>

      <div class="flex flex-col md:flex-row gap-3 justify-between items-center mb-10">
        <button onclick="addAdminQuestion()" class="w-full md:w-auto px-6 py-3 rounded-xl font-bold text-sm text-yellow-300 bg-yellow-900/40 border border-dashed border-yellow-500 hover:bg-yellow-900/70">
          <i class="fa-solid fa-plus mr-2"></i>새 문제 추가하기
        </button>
        <button onclick="saveAdminQuizData()" class="w-full md:w-auto btn-magic px-8 py-3 rounded-xl font-bold text-base text-yellow-300">
          <i class="fa-solid fa-check mr-2"></i>모든 변경사항 영구 저장하기
        </button>
      </div>
    </div>
  `);
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function updateAdminField(qIdx, field, value) {
  tempQuizList[qIdx][field] = value;
}

function updateAdminOption(qIdx, oIdx, value) {
  tempQuizList[qIdx].options[oIdx] = value;
}

function updateAdminAnswer(qIdx, oIdx) {
  tempQuizList[qIdx].answer = oIdx;
  renderAdminEditor();
}

function updateAdminImageUrl(qIdx, url) {
  tempQuizList[qIdx].imageUrl = url.trim();
  const box = document.getElementById(`preview-box-${qIdx}`);
  const img = document.getElementById(`preview-img-${qIdx}`);
  if (url.trim()) {
    img.src = url.trim();
    box.classList.remove('hidden');
  } else {
    box.classList.add('hidden');
  }
}

function handleAdminImageUpload(qIdx, input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 1.5 * 1024 * 1024) {
    alert("파일 크기가 1.5MB를 초과합니다. 여러 기기에서 빠르게 불러오려면 인터넷 이미지/GIF 주소(URL)를 붙여넣는 것을 권장합니다.");
  }
  const reader = new FileReader();
  reader.onload = function(e) {
    tempQuizList[qIdx].imageUrl = e.target.result;
    renderAdminEditor();
  };
  reader.readAsDataURL(file);
}

function clearAdminImage(qIdx) {
  tempQuizList[qIdx].imageUrl = "";
  renderAdminEditor();
}

function addAdminQuestion() {
  tempQuizList.push({
    id: Date.now(),
    question: "새로운 마법 문제를 입력하세요",
    imageUrl: "",
    options: ["보기 1", "보기 2", "보기 3", "보기 4"],
    answer: 0,
    timeLimit: 15,
    points: 1000
  });
  renderAdminEditor();
}

function deleteAdminQuestion(qIdx) {
  if (tempQuizList.length <= 1) {
    alert("최소 1개 이상의 문제가 필요합니다.");
    return;
  }
  if (confirm(`문제 ${qIdx + 1}번을 삭제하시겠습니까?`)) {
    tempQuizList.splice(qIdx, 1);
    renderAdminEditor();
  }
}

function resetAdminQuizData() {
  if (confirm("모든 문제를 초기 기본값으로 되돌리시겠습니까?")) {
    tempQuizList = JSON.parse(JSON.stringify(DEFAULT_QUIZ_DATA));
    renderAdminEditor();
  }
}

async function saveAdminQuizData() {
  for (let i = 0; i < tempQuizList.length; i++) {
    const q = tempQuizList[i];
    if (!q.question.trim()) {
      alert(`문제 ${i + 1}번의 질문 내용을 입력해 주세요.`);
      return;
    }
    if (q.options.some(opt => !opt.trim())) {
      alert(`문제 ${i + 1}번의 4개 선택지를 모두 입력해 주세요.`);
      return;
    }
    if (!q.points || q.points <= 0) q.points = 1000;
    if (!q.timeLimit || q.timeLimit < 3) q.timeLimit = 15;
  }

  QUIZ_DATA = JSON.parse(JSON.stringify(tempQuizList));
  const ok = await saveQuizDataToServer(QUIZ_DATA);
  if (ok) {
    alert("퀴즈 설정이 저장되었습니다!");
    showRoleSelection();
  }
}

// ==========================================
// 5. HOST (진행자) 로직
// ==========================================
class HostController {
  constructor() {
    this.pin = Math.floor(100000 + Math.random() * 900000).toString();
    this.players = new Map();
    this.currentQIndex = -1;
    this.state = 'LOBBY';
    this.timer = null;
    this.timeLeft = 0;
    this.questionStartTime = 0;

    bus.connect(this.pin, () => {
      console.log(`[Host] Supabase Realtime connected on PIN: ${this.pin}`);
    });
    bus.onMessage((msg) => this.handleMessage(msg));
  }

  handleMessage(msg) {
    if (msg.type === 'JOIN') {
      const { playerId, nickname, house } = msg;
      let player = this.players.get(playerId);
      if (!player) {
        player = {
          id: playerId,
          nickname,
          house,
          score: 0,
          lastAnswer: null,
          lastGained: 0
        };
        this.players.set(playerId, player);
      } else {
        player.nickname = nickname;
        player.house = house;
      }

      bus.send({
        type: 'JOIN_RESULT',
        targetId: playerId,
        success: true,
        gameState: this.state
      });
      this.renderLobby();

    } else if (msg.type === 'ANSWER') {
      if (this.state !== 'QUESTION') return;
      const { playerId, answerIndex } = msg;
      const player = this.players.get(playerId);

      if (player && player.lastAnswer === null) {
        const now = Date.now();
        const timeTaken = (now - this.questionStartTime) / 1000;
        const q = QUIZ_DATA[this.currentQIndex];

        player.lastAnswer = answerIndex;
        if (answerIndex === q.answer) {
          const maxPoints = q.points || 1000;
          const basePoints = Math.round(maxPoints * 0.5);
          const bonusPoints = maxPoints - basePoints;
          const remainingRatio = Math.max(0, (q.timeLimit - timeTaken) / q.timeLimit);
          const scoreGained = Math.round(basePoints + (bonusPoints * remainingRatio));
          player.score += scoreGained;
          player.lastGained = scoreGained;
        } else {
          player.lastGained = 0;
        }
        this.updateSubmittedCount();
      }
    }
  }

  renderLobby() {
    setBadge(`진행자 | PIN: ${this.pin}`);
    const playerList = Array.from(this.players.values());

    renderScreen(`
      <div class="w-full max-w-3xl flex flex-col items-center">
        <div class="magic-card p-6 rounded-2xl w-full text-center mb-6 relative">
          <button onclick="openChairmanPrompt()" class="absolute top-4 right-4 text-xs px-3 py-1 border border-yellow-500/50 bg-yellow-950/60 rounded-full text-yellow-300 hover:bg-yellow-800/60">
            <i class="fa-solid fa-key mr-1"></i>위원장 모드
          </button>
          <span class="text-sm text-yellow-300/70">참가 PIN 번호</span>
          <div class="text-5xl font-black font-magic text-yellow-400 tracking-widest my-2 gold-glow">${this.pin}</div>
          <p class="text-xs text-yellow-200/60">참가자는 스마트폰에서 위 PIN 번호를 입력하세요</p>
        </div>

        <div class="w-full mb-6">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-xl font-bold text-yellow-300">접속한 학생들 (${playerList.length}명)</h2>
            <button onclick="hostAddBot()" class="text-xs px-3 py-1 bg-yellow-900/50 border border-yellow-600 rounded text-yellow-300 hover:bg-yellow-800/50">
              + 가상 봇 추가
            </button>
          </div>
          <div class="grid grid-cols-2 md:grid-cols-3 gap-3 max-h-72 overflow-y-auto custom-scrollbar pr-1">
            ${playerList.map(p => {
              const h = HOUSES.find(x => x.id === p.house) || HOUSES[0];
              return `
                <div class="p-3 rounded-xl border ${h.color} flex items-center space-x-3 shadow-md">
                  <i class="fa-solid ${h.icon} text-lg"></i>
                  <div class="truncate">
                    <div class="font-bold text-sm truncate">${escapeHtml(p.nickname)}</div>
                    <div class="text-xs opacity-75">${h.name}</div>
                  </div>
                </div>
              `;
            }).join('')}
            ${playerList.length === 0 ? '<div class="col-span-full text-center py-8 text-yellow-500/50">학생들이 입장을 기다리고 있습니다...</div>' : ''}
          </div>
        </div>

        <button onclick="host.nextQuestion()" ${playerList.length === 0
          ? 'disabled class="opacity-50 btn-magic px-8 py-4 rounded-xl font-bold text-lg text-yellow-300 cursor-not-allowed"'
          : 'class="btn-magic px-8 py-4 rounded-xl font-bold text-lg text-yellow-300"'}>
          퀴즈 시작하기 (총 ${QUIZ_DATA.length}문제)
        </button>
      </div>
    `);
  }

  nextQuestion() {
    this.currentQIndex++;
    if (this.currentQIndex >= QUIZ_DATA.length) {
      this.endGame();
      return;
    }

    this.players.forEach(p => {
      p.lastAnswer = null;
      p.lastGained = 0;
    });

    const q = QUIZ_DATA[this.currentQIndex];
    this.state = 'QUESTION';
    this.timeLeft = q.timeLimit;
    this.questionStartTime = Date.now();

    bus.send({
      type: 'QUESTION',
      questionIndex: this.currentQIndex,
      totalQuestions: QUIZ_DATA.length,
      question: q.question,
      options: q.options,
      timeLimit: q.timeLimit
    });

    this.renderQuestionView();
    this.startTimer();
  }

  startTimer() {
    if (this.timer) clearInterval(this.timer);
    this.timer = setInterval(() => {
      this.timeLeft--;
      const timerEl = document.getElementById('host-timer');
      if (timerEl) timerEl.innerText = this.timeLeft;
      if (this.timeLeft <= 0) {
        clearInterval(this.timer);
        this.revealAnswer();
      }
    }, 1000);
  }

  updateSubmittedCount() {
    const submitted = Array.from(this.players.values()).filter(p => p.lastAnswer !== null).length;
    const total = this.players.size;
    const el = document.getElementById('submitted-count');
    if (el) el.innerText = `${submitted} / ${total}`;

    if (submitted >= total && total > 0) {
      if (this.timer) clearInterval(this.timer);
      this.revealAnswer();
    }
  }

  renderQuestionView() {
    const q = QUIZ_DATA[this.currentQIndex];
    const hasMedia = q.imageUrl && q.imageUrl.trim() !== '';

    renderScreen(`
      <div class="w-full max-w-3xl flex flex-col items-center">
        <div class="flex justify-between items-center w-full mb-4 px-2">
          <div class="flex items-center space-x-3">
            <span class="text-yellow-400 font-bold">Q ${this.currentQIndex + 1} / ${QUIZ_DATA.length}</span>
            <span class="text-xs px-2.5 py-0.5 rounded-full bg-yellow-900/60 border border-yellow-500/40 text-yellow-300">
              배점: ${q.points || 1000}점
            </span>
          </div>
          <div class="text-2xl font-black text-yellow-400 bg-yellow-950/60 border border-yellow-500/40 px-4 py-1 rounded-full">
            <span id="host-timer">${this.timeLeft}</span>초
          </div>
        </div>

        <div class="magic-card p-6 md:p-8 rounded-2xl w-full text-center mb-6">
          <h2 class="text-2xl md:text-3xl font-bold text-yellow-200 ${hasMedia ? 'mb-5' : ''}">${escapeHtml(q.question)}</h2>
          ${hasMedia ? `
            <div class="flex justify-center">
              <img src="${q.imageUrl}" alt="문제 이미지" class="max-h-64 md:max-h-80 rounded-xl border-2 border-yellow-500/50 shadow-lg object-contain bg-black/40">
            </div>
          ` : ''}
        </div>

        <div class="grid grid-cols-2 gap-4 w-full mb-6">
          ${q.options.map((opt, i) => `
            <div class="opt-${i} p-4 rounded-xl text-white font-bold text-center text-lg shadow-lg flex items-center justify-center min-h-[70px]">
              <span class="mr-2 opacity-80">${['▲', '◆', '●', '■'][i]}</span> ${escapeHtml(opt)}
            </div>
          `).join('')}
        </div>

        <div class="text-sm text-yellow-300/80 mb-4">
          제출 완료: <span id="submitted-count" class="font-bold text-yellow-400">0 / ${this.players.size}</span>
        </div>

        <button onclick="host.revealAnswer()" class="text-xs text-yellow-400/60 underline hover:text-yellow-300">
          바로 결과 공개
        </button>
      </div>
    `);
  }

  revealAnswer() {
    if (this.timer) clearInterval(this.timer);
    this.state = 'REVEAL';
    const q = QUIZ_DATA[this.currentQIndex];

    const sortedPlayers = Array.from(this.players.values())
      .sort((a, b) => b.score - a.score);

    bus.send({
      type: 'REVEAL',
      correctAnswer: q.answer,
      scores: sortedPlayers.map((p, idx) => ({
        id: p.id,
        rank: idx + 1,
        score: p.score,
        gained: p.lastGained,
        isCorrect: p.lastAnswer === q.answer
      }))
    });

    this.renderRevealView();
  }

  renderRevealView() {
    const q = QUIZ_DATA[this.currentQIndex];
    const sortedPlayers = Array.from(this.players.values())
      .sort((a, b) => b.score - a.score);

    const correctCount = sortedPlayers.filter(p => p.lastAnswer === q.answer).length;

    renderScreen(`
      <div class="w-full max-w-3xl flex flex-col items-center">

          <h2 class="text-xl font-bold text-yellow-400">
            <i class="fa-solid fa-scroll mr-2"></i>Q${this.currentQIndex + 1} 정답 공개

          <span class="text-xs text-yellow-200/80 bg-yellow-950/70 border border-yellow-500/40 px-3 py-1 rounded-full">
            정답자: ${correctCount}명 / 전체 ${sortedPlayers.length}명

                    ${isCorrect

                          ? `<span class="text-[11px] px-2 py-0.5 rounded bg-red-600/20 text-red-300 border border-red-500/30 shrink-0">❌ 오답</span>`
                          : `<span class="text-[11px] px-2 py-0.5 rounded bg-gray-700/40 text-gray-300 shrink-0">미제출</span>`

        </button>
      </div>
    `);
  }

  endGame() {
    this.state = 'END';
    const sorted = Array.from(this.players.values()).sort((a, b) => b.score - a.score);

              return `

                  <div class="flex items-center space-x-3">

                    <span class="text-xs px-2 py-0.5 rounded ${h.color}">${h.name}</span>

                  <span class="font-black text-yellow-400">${p.score.toLocaleString()} pts</span>

              `;
            }).join('')}
          </div>
        </div>

        <button onclick="showRoleSelection()" class="btn-magic px-8 py-3 rounded-xl font-bold text-yellow-300">
          메인 화면으로 돌아가기
        </button>
      </div>
    `);
  }
}

// ==========================================
// 6. PLAYER (참가자) 로직
// ==========================================
class PlayerController {
  constructor() {
    let savedId = localStorage.getItem('hp_quiz_player_id');
    if (!savedId) {
      savedId = 'player-' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('hp_quiz_player_id', savedId);
    }
    this.id = savedId;
    this.nickname = '';
    this.house = HOUSES[0].id;
    this.pin = '';
    this.myScore = 0;
    this.myRank = null;
    this.selectedAnswer = null;
    this.hasAnswered = false;
  }

  joinGame(pin, nickname, house) {
    this.pin = pin;
    this.nickname = nickname;
    this.house = house;

    bus.connect(this.pin, () => {
      bus.send({
        type: 'JOIN',
        playerId: this.id,
        nickname: this.nickname,
        house: this.house
      });
    });

    bus.onMessage((msg) => this.handleMessage(msg));

    renderScreen(`
      <div class="magic-card p-8 rounded-2xl text-center max-w-md w-full">
        <i class="fa-solid fa-spinner fa-spin text-3xl text-yellow-400 mb-4"></i>
        <h2 class="text-xl font-bold text-yellow-300 mb-2">호그와트 연결 중...</h2>
        <p class="text-xs text-yellow-200/60">진행자가 게임을 시작할 때까지 기다려주세요.</p>
      </div>
    `);
  }

  handleMessage(msg) {
    if (msg.type === 'JOIN_RESULT') {
      if (msg.targetId === this.id && msg.success) {
        this.renderWaitingView();
      }
    } else if (msg.type === 'QUESTION') {
      this.selectedAnswer = null;
      this.hasAnswered = false;
      this.renderQuestionView(msg);
    } else if (msg.type === 'REVEAL') {
      const myResult = msg.scores.find(s => s.id === this.id);
      if (myResult) {
        this.myScore = myResult.score;
        this.myRank = myResult.rank;
      }
      this.renderResultView(msg.correctAnswer, myResult ? myResult.isCorrect : false, myResult ? myResult.gained : 0);
    } else if (msg.type === 'GAME_OVER') {
      if (msg.rankings) {
        const me = msg.rankings.find(r => r.id === this.id);
        if (me) {
          this.myScore = me.score;
          this.myRank = me.rank;
        }
      }
      this.renderGameOverView();
    } else if (msg.type === 'RESET') {
      showRoleSelection();
    }
  }

  renderWaitingView() {
    const h = HOUSES.find(x => x.id === this.house) || HOUSES[0];
    setBadge(`참가자 | ${this.nickname}`);
    renderScreen(`
      <div class="magic-card p-8 rounded-2xl text-center max-w-md w-full">
        <div class="inline-block p-4 rounded-full ${h.color} mb-4">
          <i class="fa-solid ${h.icon} text-3xl"></i>
        </div>
        <h2 class="text-2xl font-bold text-yellow-300 mb-1">${escapeHtml(this.nickname)}</h2>
        <p class="text-sm text-yellow-200/70 mb-6">${h.name} 기숙사</p>
        <div class="p-4 rounded-xl bg-yellow-950/40 border border-yellow-600/30 text-yellow-400 animate-pulse text-sm">
          진행자가 문제를 내기를 기다리고 있습니다...
        </div>
      </div>
    `);
  }

  sendAnswer(index) {
    if (this.hasAnswered) return;
    this.selectedAnswer = index;
    this.hasAnswered = true;

    bus.send({
      type: 'ANSWER',
      playerId: this.id,
      answerIndex: index
    });

    this.renderAnswerSubmittedView();
  }

  renderQuestionView(qMsg) {
    renderScreen(`
      <div class="w-full max-w-md flex flex-col items-center">
        <div class="flex justify-between items-center w-full mb-4 px-2">
          <span class="text-xs text-yellow-400">Q ${qMsg.questionIndex + 1} / ${qMsg.totalQuestions}</span>
          <span class="text-xs text-yellow-300 font-bold">내 점수: ${this.myScore.toLocaleString()}</span>
        </div>
        <div class="grid grid-cols-2 gap-4 w-full h-64">
          ${qMsg.options.map((_, idx) => `
            <button onclick="player.sendAnswer(${idx})" class="opt-${idx} rounded-2xl flex items-center justify-center text-white text-4xl font-bold shadow-lg active:scale-95 transition-transform">
              ${['▲', '◆', '●', '■'][idx]}
            </button>
          `).join('')}
        </div>
      </div>
    `);
  }

  renderAnswerSubmittedView() {
    renderScreen(`
      <div class="magic-card p-8 rounded-2xl text-center max-w-md w-full">
        <i class="fa-solid fa-paper-plane text-4xl text-yellow-400 mb-4 animate-bounce"></i>
        <h2 class="text-2xl font-bold text-yellow-300 mb-2">답안 제출 완료!</h2>
        <p class="text-xs text-yellow-200/60">다른 학생들의 제출을 기다리는 중입니다.</p>
      </div>
    `);
  }

  renderResultView(correctAnswer, isCorrect, gained) {
    renderScreen(`
      <div class="magic-card p-8 rounded-2xl text-center max-w-md w-full">
        <div class="text-5xl mb-4">
          ${isCorrect ? '✨' : '💥'}
        </div>
        <h2 class="text-2xl font-bold ${isCorrect ? 'text-green-400' : 'text-red-400'} mb-2">
          ${isCorrect ? `정답입니다! (+${gained}점)` : '틀렸습니다...'}
        </h2>
        <div class="text-lg text-yellow-300 font-bold mb-1">
          누적 점수: ${this.myScore.toLocaleString()} pts
        </div>
        ${this.myRank ? `<div class="text-sm text-yellow-200/80 mb-6">현재 순위: ${this.myRank}등</div>` : '<div class="mb-6"></div>'}
        <p class="text-xs text-yellow-200/60">다음 문제를 기다려주세요</p>
      </div>
    `);
  }

  renderGameOverView() {
    renderScreen(`
      <div class="magic-card p-8 rounded-2xl text-center max-w-md w-full">
        <i class="fa-solid fa-award text-5xl text-yellow-400 mb-4 gold-glow"></i>
        <h2 class="text-3xl font-bold font-magic text-yellow-400 mb-2">퀴즈 종료!</h2>
        ${this.myRank ? `<p class="text-lg font-bold text-yellow-200 mb-1">최종 ${this.myRank}등</p>` : ''}
        <p class="text-sm text-yellow-200/70 mb-4">최종 점수</p>
        <div class="text-4xl font-black text-yellow-300 gold-glow mb-6">${this.myScore.toLocaleString()} pts</div>
        <button onclick="showRoleSelection()" class="btn-magic px-6 py-3 rounded-xl font-bold text-yellow-300 text-sm">
          메인 화면으로
        </button>
      </div>
    `);
  }
}

function submitJoin() {
  const pin = document.getElementById('join-pin').value.trim();
  const name = document.getElementById('join-name').value.trim();
  const house = document.querySelector('input[name="house"]:checked')?.value || 'gryffindor';

  if (!pin || pin.length < 6) {
    alert("6자리 PIN 번호를 입력해주세요.");
    return;
  }
  if (!name) {
    alert("이름을 입력해주세요.");
    return;
  }
  player.joinGame(pin, name, house);
}
